services:
  backend:
    build:
      context: ./octaclin-backend
    environment:
      NODE_ENV: production
      PORTA_HTTP: 3000
      BANCO_HOST: postgres
      BANCO_PORTA: 5432
      BANCO_USUARIO: octaclin
      BANCO_SENHA: octaclin_local
      BANCO_NOME: octaclin
      REDIS_HOST: redis
      REDIS_PORTA: 6379
      CLAMAV_HOST: clamav
      CLAMAV_PORTA: 3310
      IA_SERVICE_URL: http://ia-service:8001
      IA_SERVICE_TOKEN: ${IA_SERVICE_TOKEN}
      IA_SERVICE_TIMEOUT_MS: 15000
      JWT_SEGREDO: trocar-em-producao
      JWT_REFRESH_SEGREDO: trocar-em-producao-refresh
      CRIPTOGRAFIA_CHAVE_AES_256: trocar-em-producao
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - clamav
      - ia-service

  web:
    build:
      context: ./octaclin-web
    environment:
      NODE_ENV: production
      OCTACLIN_BACKEND_URL: http://backend:3000
      OCTACLIN_TENANT_SLUG: clinica-carla
      OCTACLIN_API_ORIGENS_PERMITIDAS: http://backend:3000
      OCTACLIN_COOKIE_SECURE: "false"
    ports:
      - "3001:3000"
    depends_on:
      - backend

  ia-service:
    build:
      context: ./octaclin-ai-service
    environment:
      OPENAI_API_KEY: ""
      IA_SERVICE_TOKEN: ${IA_SERVICE_TOKEN}
    ports:
      - "8001:8001"

  postgres:
    image: timescale/timescaledb-ha:pg15
    environment:
      POSTGRES_USER: octaclin
      POSTGRES_PASSWORD: octaclin_local
      POSTGRES_DB: octaclin
    volumes:
      - postgres_dados_prod:/home/postgres/pgdata/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_dados_prod:/data

  # Compose local de referencia. Producao real (Render) precisa do daemon
  # clamd provisionado como servico separado -- ver VARIAVEIS_AMBIENTE.md e o
  # runbook aplicavel; este arquivo nao e o que roda em producao.
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_dados_prod:/var/lib/clamav

volumes:
  postgres_dados_prod:
  redis_dados_prod:
  clamav_dados_prod:
