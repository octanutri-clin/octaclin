# Politica de supply chain do backend (PR 49).
# Ver docs/governance/POLITICA_SUPPLY_CHAIN_DEPENDENCIAS.md e o ledger
# docs/governance/excecoes-supply-chain.json para cada excecao datada.
packages:
  - "."

# Migrado de `pnpm.overrides` do package.json: o pnpm 11 nao le mais aquele
# bloco. Manter aqui preserva as remediacoes ja aplicadas.
overrides:
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  fast-uri@3: 3.1.5
  js-yaml@3: 3.15.1
  js-yaml@4: 4.3.1

# Lifecycle script de dependencia negado por padrao. Cada pacote com script
# recebe decisao explicita; `false` e negacao auditada, nao ausencia de analise.
strictDepBuilds: true
allowBuilds:
  # ssh2 -> cpu-features: acelerador nativo opcional; ssh2 opera em JS puro.
  # Cadeia dev: testcontainers > dockerode > docker-modem > ssh2.
  cpu-features: false
  ssh2: false
  # protobufjs: postinstall so regenera artefatos empacotados. Cadeia dev:
  # testcontainers > dockerode > @grpc/proto-loader.
  protobufjs: false
  # unrs-resolver: binarios pre-compilados chegam como optionalDependencies.
  # Cadeia dev: jest > jest-resolve.
  unrs-resolver: false
  # msgpackr-extract: acelerador nativo opcional de msgpackr (bullmq).
  # msgpackr degrada para JS puro; suite backend valida o caminho de filas.
  msgpackr-extract: false

# 1440 minutos (24h). O valor nao e livre: com `minimumReleaseAgeStrict` o pnpm
# reaplica a janela ao lockfile a cada instalacao, entao o teto pratico e a idade
# do pacote mais novo ja travado. Medido em 2026-09-01, 10080 (7 dias) reprovava
# a instalacao congelada em 8 entradas do backend e 43 da web, vindas de bumps
# recentes do Dependabot. Como o proprio Dependabot ja espera 3 a 30 dias por
# cooldown, 1440 cobre a janela que resta: instalacao manual de pacote
# recem-publicado.
#
# A regra pnpm-minimum-release-age do Semgrep exige 10080 (7 dias) fixo e
# reprova qualquer valor menor, inclusive este. A divergencia e deliberada e
# esta medida acima: 10080 reprova a instalacao congelada. Suprimida aqui, e
# nao dispensada no Security tab, para que a decisao viva versionada e passe
# por review junto de qualquer mudanca futura deste valor.
# A supressao e por `nosemgrep` sem rule id: a forma qualificada pelo id
# completo nao casou sob `semgrep scan --config auto`. Esta linha so e
# alcancada por esta regra, entao o escopo mais largo nao esconde nada.
minimumReleaseAge: 1440 # nosemgrep
minimumReleaseAgeStrict: true

trustPolicy: no-downgrade
# Excecoes datadas e com owner no ledger de supply chain.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

blockExoticSubdeps: true

verifyStoreIntegrity: true
strictStorePkgContentCheck: true
