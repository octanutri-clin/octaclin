version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /octaclin-backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      # Pacote `0.x` nao entra em grupo de rotina.
      #
      # O Dependabot classifica por semver, e para `0.x` o semver mente: pela
      # propria especificacao, projeto abaixo de `1.0.0` pode quebrar em qualquer
      # minor, e frameworks usam isso -- cada `0.x` do React Native e um release
      # major dele. Sem esta exclusao, o grupo "minor e patch" entrega major de
      # framework como rotina.
      #
      # Nao e hipotese: o PR #177 subiu `react-native` de 0.86.2 para 0.87.0
      # dentro do grupo `mobile-minor-patch` e reprovou o typecheck do mobile com
      # dezenas de erros de tipagem.
      #
      # A lista e por nome porque o Dependabot nao sabe filtrar por faixa de
      # versao aqui. Lista por nome envelhece, entao ela nao e mantida na mao:
      # `pnpm test:grupos-dependabot` le os `package.json`, calcula quais
      # dependencias estao em `0.x` e reprova quando uma delas pode ser agrupada.
      backend-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "class-transformer"
          - "class-validator"
          - "reflect-metadata"

  - package-ecosystem: npm
    directory: /octaclin-web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      # Pacote `0.x` nao entra em grupo de rotina.
      #
      # O Dependabot classifica por semver, e para `0.x` o semver mente: pela
      # propria especificacao, projeto abaixo de `1.0.0` pode quebrar em qualquer
      # minor, e frameworks usam isso -- cada `0.x` do React Native e um release
      # major dele. Sem esta exclusao, o grupo "minor e patch" entrega major de
      # framework como rotina.
      #
      # Nao e hipotese: o PR #177 subiu `react-native` de 0.86.2 para 0.87.0
      # dentro do grupo `mobile-minor-patch` e reprovou o typecheck do mobile com
      # dezenas de erros de tipagem.
      #
      # A lista e por nome porque o Dependabot nao sabe filtrar por faixa de
      # versao aqui. Lista por nome envelhece, entao ela nao e mantida na mao:
      # `pnpm test:grupos-dependabot` le os `package.json`, calcula quais
      # dependencias estao em `0.x` e reprova quando uma delas pode ser agrupada.
      web-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "class-variance-authority"

  - package-ecosystem: npm
    directory: /octaclin-mobile
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      # Pacote `0.x` nao entra em grupo de rotina.
      #
      # O Dependabot classifica por semver, e para `0.x` o semver mente: pela
      # propria especificacao, projeto abaixo de `1.0.0` pode quebrar em qualquer
      # minor, e frameworks usam isso -- cada `0.x` do React Native e um release
      # major dele. Sem esta exclusao, o grupo "minor e patch" entrega major de
      # framework como rotina.
      #
      # Nao e hipotese: o PR #177 subiu `react-native` de 0.86.2 para 0.87.0
      # dentro do grupo `mobile-minor-patch` e reprovou o typecheck do mobile com
      # dezenas de erros de tipagem.
      #
      # A lista e por nome porque o Dependabot nao sabe filtrar por faixa de
      # versao aqui. Lista por nome envelhece, entao ela nao e mantida na mao:
      # `pnpm test:grupos-dependabot` le os `package.json`, calcula quais
      # dependencias estao em `0.x` e reprova quando uma delas pode ser agrupada.
      mobile-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@react-native/metro-config"
          - "react-native"
          - "react-native-web"
          - "react-native-worklets"
    # Pacotes presos a faixa que o Expo SDK instalado aceita, nao ao semver
    # solto do pacote. `expo-doctor` reprova quando react/react-dom saem da
    # versao exata esperada ou quando react-native-safe-area-context/
    # react-native-screens saem da faixa `~` que o SDK 57 declara.
    #
    # Nao e hipotese: o PR #295 (grupo mobile-minor-patch) bumpou os quatro
    # alem do aceito pelo SDK 57 e reprovou o job `Mobile Expo`
    # (`Check that packages match versions required by installed Expo SDK`).
    # `@types/react` segue a mesma trilha para nao destoar da versao real do
    # `react`. A versao correta desses pacotes vem de `expo install --fix`
    # quando o SDK e atualizado, nunca de um bump semver isolado do
    # Dependabot -- por isso ficam fora do agrupamento e fora de update
    # automatico, em `ignore`, e nao em `exclude-patterns` do grupo (esse
    # campo e reservado para dependencias `0.x`; `pnpm test:grupos-dependabot`
    # reprova exclusao que nao corresponda a uma dependencia `0.x`).
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"

  - package-ecosystem: pip
    directory: /octaclin-ai-service
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # `pydantic-core` e transitivo de `pydantic` em requirements.txt; nao
    # aparece la como dependencia direta. O PR #282 deixou o Dependabot
    # regenerar so o lock para subir pydantic-core isolado (2.46.5 -> 2.49.0)
    # sem tocar pydantic (2.13.5), que exige pydantic-core==2.46.5 exato --
    # `pip install --require-hashes` reprovou com ResolutionImpossible. A
    # versao estavel de pydantic compativel com pydantic-core novo nao existia
    # ainda (so pre-release). Atualizacao de pydantic-core so e segura junto
    # com a de pydantic; ela fica de fora do Dependabot ate que uma atualizacao
    # de `pydantic` (dependencia direta) volte a arrastar o transitivo junto,
    # regenerando o lock pelo procedimento da secao 8 da
    # docs/governance/POLITICA_SUPPLY_CHAIN_DEPENDENCIAS.md.
    ignore:
      - dependency-name: "pydantic-core"

  # PR 50: atualizacao rastreavel do digest das imagens base. Dependabot abre PR
  # com o novo digest; o merge segue o mesmo fluxo humano (scan -> build ->
  # harness -> SBOM -> review). Sem auto-merge.
  # Major da imagem base do Node nao e bump de rotina: a secao 16 da
  # docs/governance/POLITICA_SUPPLY_CHAIN_DEPENDENCIAS.md documenta que a
  # versao do Node esta escrita em quatro lugares que precisam mover juntos
  # (NODE_VERSION no CI, `FROM node:<major>` no Dockerfile, `engines.node` de
  # cada package.json e `@types/node`) -- foi por isso que os PRs #180 e #181
  # (node:26-alpine com o CI parado em 22) foram fechados. Os PRs #281 e #283
  # repetiram o padrao trocando so o `FROM` para node:25-alpine, uma linha
  # `Current` sem LTS, ja perto do fim do suporte -- regressao de manutencao,
  # nao modernizacao. Major de runtime fica reservado para PR dedicado que
  # move as quatro declaracoes e mira uma linha LTS; o Dependabot para de
  # propor sozinho.
  - package-ecosystem: docker
    directory: /octaclin-backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /octaclin-web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /octaclin-ai-service
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
