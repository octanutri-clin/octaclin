name: Trivy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "20 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: octaclin-trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisar:
    name: Trivy (vuln/misconfig/license, warning)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Escanear filesystem (não bloqueante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,license
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Publicar resultado no Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Gerar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cyclonedx.json

      # Segunda execucao sobre o mesmo checkout limpo. O SBOM nao e byte a byte
      # identico -- serialNumber e timestamp mudam a cada execucao -- entao a
      # comparacao e do inventario semantico normalizado.
      - name: Gerar SBOM novamente para prova de reproducao
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cyclonedx.repeticao.json

      - name: Provar cobertura e reproducao semantica do SBOM
        run: node scripts/validar-sbom.mjs sbom.cyclonedx.json sbom.cyclonedx.repeticao.json

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  # Provenance verificavel do SBOM. Roda em job separado justamente para que
  # `id-token: write` e `attestations: write` nao alcancem o job de scan.
  # Nao roda em pull_request: PR de fork nao recebe token com essas permissoes.
  atestar-sbom:
    name: Provenance do SBOM
    needs: analisar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sbom-cyclonedx

      - name: Gerar atestado de proveniencia do SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.cyclonedx.json
