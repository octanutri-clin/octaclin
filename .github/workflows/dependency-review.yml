name: Dependency Review

# Bloqueia risco NOVO introduzido pelo PR, sem transformar divida historica ja
# triada em bloqueio cego: a action compara a base com o head e so reporta as
# dependencias que o PR adiciona ou atualiza.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: octaclin-dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    name: Dependency Review (critical/high e licencas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Derivar licencas da politica versionada
        id: license-policy
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { licencasParaDependencyReview } from './scripts/validar-licencas.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT, `allow=${licencasParaDependencyReview().join(',')}\n`);
          NODE

      - name: Revisar dependencias novas ou atualizadas
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Politica de vulnerabilidade: critical/high novo nao entra.
          fail-on-severity: high
          # A allowlist respeita OR/AND SPDX da politica aprovada; revisao
          # por pacote continua obrigatoria nos inventarios instalados do CI.
          allow-licenses: ${{ steps.license-policy.outputs.allow }}
          # Sem comentario no PR: manteria a necessidade de pull-requests: write.
          comment-summary-in-pr: never
          warn-only: false
