name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagem"
        required: true
        default: "latest"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
            context: octaclin-backend
            repository_secret: AWS_ECR_BACKEND_REPOSITORY
          - name: web
            context: octaclin-web
            repository_secret: AWS_ECR_WEB_REPOSITORY
          - name: ia-service
            context: octaclin-ai-service
            repository_secret: AWS_ECR_AI_REPOSITORY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Build and push
        env:
          REPOSITORY: ${{ secrets[matrix.service.repository_secret] }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          BUILD_CONTEXT: ${{ matrix.service.context }}
        run: |
          docker build -t "$REPOSITORY:$IMAGE_TAG" "$BUILD_CONTEXT"
          docker push "$REPOSITORY:$IMAGE_TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Force ECS deployment
        env:
          ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
          ECS_BACKEND_SERVICE: ${{ secrets.AWS_ECS_BACKEND_SERVICE }}
          ECS_WEB_SERVICE: ${{ secrets.AWS_ECS_WEB_SERVICE }}
          ECS_AI_SERVICE: ${{ secrets.AWS_ECS_AI_SERVICE }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_BACKEND_SERVICE" --force-new-deployment
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_WEB_SERVICE" --force-new-deployment
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_AI_SERVICE" --force-new-deployment
