name: FOOD06 fontes documentais

on:
  pull_request:
    paths:
      - 'research/food06/**'
      - '.github/workflows/food06-research.yml'

permissions:
  contents: read

concurrency:
  group: food06-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fontes-sinteticas:
    name: FOOD06 coleta e extracao sinteticas
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Testar ferramentas documentais sem chamadas externas
        run: python3 -m unittest discover -s research/food06 -p 'test_*.py' -v
      - name: Conferir fixture do oraculo aritmetico independente
        run: |
          python3 research/food06/gerar_oraculo_aritmetico.py --saida "$RUNNER_TEMP/food06-oraculo.json"
          cmp research/food06/oraculo-fracoes-sinteticas.json "$RUNNER_TEMP/food06-oraculo.json"
