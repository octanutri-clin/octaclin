name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagem"
        required: true
        default: "latest"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
            context: octaclin-backend
            app_secret: AZURE_CONTAINER_APP_BACKEND
          - name: web
            context: octaclin-web
            app_secret: AZURE_CONTAINER_APP_WEB
          - name: ia-service
            context: octaclin-ai-service
            app_secret: AZURE_CONTAINER_APP_AI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push
        env:
          ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          SERVICE_NAME: ${{ matrix.service.name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          BUILD_CONTEXT: ${{ matrix.service.context }}
          CONTAINER_APP: ${{ secrets[matrix.service.app_secret] }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$SERVICE_NAME:$IMAGE_TAG"
          az acr login --name "$ACR_NAME"
          docker build -t "$IMAGE" "$BUILD_CONTEXT"
          docker push "$IMAGE"
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"
