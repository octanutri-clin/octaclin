name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagem"
        required: true
        default: "latest"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
            context: octaclin-backend
            app_secret: AZURE_CONTAINER_APP_BACKEND
          - name: web
            context: octaclin-web
            app_secret: AZURE_CONTAINER_APP_WEB
          - name: ia-service
            context: octaclin-ai-service
            app_secret: AZURE_CONTAINER_APP_AI
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push
        run: |
          IMAGE="${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ inputs.image_tag }}"
          az acr login --name "${{ secrets.AZURE_ACR_NAME }}"
          docker build -t "$IMAGE" "${{ matrix.service.context }}"
          docker push "$IMAGE"
          az containerapp update \
            --name "${{ secrets[matrix.service.app_secret] }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"
