name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "20 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: octaclin-semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisar:
    name: Semgrep (warning)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Rodar Semgrep (não bloqueante)
        run: semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Publicar resultado no Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
