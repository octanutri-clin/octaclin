name: OctaClin CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octaclin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  rollout-seguro:
    name: Rollout seguro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node scripts/test-rollout-seguro.mjs

  operacao-lancamento:
    name: Operacao de lancamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node scripts/test-operacao-lancamento.mjs

  governanca:
    name: Governanca de repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Gates de raiz, sem dependencia instalada: rodam em segundos e falham
      # cedo. Ate o PR 34 eles existiam apenas como comando local, entao uma
      # matriz desatualizada ou um secret novo chegavam ao main sem sinal.
      - run: pnpm test:a11y:matriz
      - run: pnpm test:confiabilidade
      - run: pnpm test:actions-imutaveis
      - run: pnpm security:secrets

  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octaclin-backend
    services:
      postgres:
        # Mesma imagem do docker-compose.yml (dev local): migrations usam
        # extensoes do Timescale (timescaledb, vector), postgres:15 puro nao tem.
        image: timescale/timescaledb-ha:pg15
        env:
          POSTGRES_USER: octaclin
          POSTGRES_PASSWORD: octaclin_local
          POSTGRES_DB: octaclin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octaclin -d octaclin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BANCO_HOST: localhost
      BANCO_PORTA: "5432"
      BANCO_USUARIO: octaclin
      BANCO_SENHA: octaclin_local
      BANCO_NOME: octaclin
      RLS_PROVA_BANCO_HOST: localhost
      RLS_PROVA_BANCO_PORTA: "5432"
      RLS_PROVA_BANCO_USUARIO: octaclin_rls_prova
      RLS_PROVA_BANCO_SENHA: octaclin_rls_prova_ci
      RLS_PROVA_BANCO_NOME: octaclin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: octaclin-backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm build

      - name: Rodar migrations no Postgres real de CI
        run: pnpm run migration:run

      - name: Provisionar role de prova de RLS (sem BYPASSRLS, sem propriedade das tabelas)
        env:
          PGPASSWORD: octaclin_local
        run: |
          psql -h localhost -U octaclin -d octaclin -v ON_ERROR_STOP=1 <<'SQL'
            drop role if exists octaclin_rls_prova;
            create role octaclin_rls_prova with login password 'octaclin_rls_prova_ci' nosuperuser nocreatedb nocreaterole nobypassrls;
            grant connect on database octaclin to octaclin_rls_prova;
            grant usage on schema public to octaclin_rls_prova;
            grant select, insert, update, delete on all tables in schema public to octaclin_rls_prova;
          SQL

      - name: Suite completa
        run: pnpm test -- --runInBand

      - name: Provar RLS com Testcontainers descartavel
        run: pnpm test:rls:testcontainers

  web:
    name: Web Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octaclin-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: octaclin-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:seguranca-operacional
      # Contratos de autorizacao do BFF e validacao das APIs dinamicas do Next.
      # Rodam antes do build: sao rapidos e falham cedo quando um contrato muda.
      - run: pnpm test:authz
      - run: pnpm test:apis-dinamicas
      - run: pnpm build
      - run: pnpm test:seguranca-runtime

  mobile:
    name: Mobile Expo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octaclin-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: octaclin-mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm doctor
      - run: pnpm test:security
      - run: pnpm test:a11y
      - run: pnpm audit:security
      - run: pnpm build:validate

  ai-service:
    name: AI FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octaclin-ai-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/main.py

  demo-smoke:
    name: Demo local smoke
    runs-on: ubuntu-latest
    needs: [backend, web]
    defaults:
      run:
        shell: bash
    env:
      E2E_WEB_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3001
      E2E_TENANT_SLUG: clinica-carla
      E2E_EMAIL: admin@octaclin.local
      E2E_SENHA: OctaClin@123
      E2E_REUSE_EXISTING_SERVER: "true"
      OCTACLIN_BACKEND_URL: http://localhost:3001
      OCTACLIN_TENANT_SLUG: clinica-carla
      OCTACLIN_COOKIE_SECURE: "true"
      OCTACLIN_API_ORIGENS_PERMITIDAS: http://localhost:3001
      OCTACLIN_WEB_ORIGENS_PERMITIDAS: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            octaclin-backend/pnpm-lock.yaml
            octaclin-web/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: octaclin-backend
        run: pnpm install --frozen-lockfile=false

      - name: Install web dependencies
        working-directory: octaclin-web
        run: pnpm install --frozen-lockfile=false

      - name: Install Playwright Chromium
        working-directory: octaclin-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web
        working-directory: octaclin-web
        run: pnpm build

      - name: Start API demo
        run: |
          node octaclin-backend/scripts/api-demo-local.mjs --port 3001 > api-demo.log 2>&1 &
          echo $! > api-demo.pid

      - name: Start web
        working-directory: octaclin-web
        run: |
          pnpm exec next start -p 3000 > ../web-next.log 2>&1 &
          echo $! > ../web-next.pid

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -fsS "$E2E_API_URL/health" >/dev/null && curl -fsS "$E2E_WEB_URL/login" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API log"
          cat api-demo.log || true
          echo "Web log"
          cat web-next.log || true
          exit 1

      - name: Smoke UI
        working-directory: octaclin-web
        run: node scripts/smoke-ui-regression.mjs

      - name: Smoke E2E BFF
        working-directory: octaclin-web
        run: node scripts/smoke-e2e-bff.mjs

      - name: Smoke visual Playwright
        working-directory: octaclin-web
        run: pnpm smoke:visual

      - name: Estados e recuperacao clinica
        working-directory: octaclin-web
        run: pnpm test:fase248

      - name: Densidade e responsividade clinica
        working-directory: octaclin-web
        run: pnpm test:fase249

      - name: Linguagem e microcopy
        working-directory: octaclin-web
        run: pnpm test:linguagem

      - name: Jornada de linguagem e microcopy
        working-directory: octaclin-web
        run: pnpm test:fase251

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-smoke-logs
          path: |
            api-demo.log
            web-next.log

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: |
            octaclin-web/playwright-report
            octaclin-web/test-results
