name: OctaClin staging E2E mutavel

on:
  workflow_dispatch:
    inputs:
      executar_seguranca_dinamica:
        description: Executar os probes limitados e o ZAP Baseline da PR54
        required: false
        default: false
        type: boolean
      confirmacao_seguranca_dinamica:
        description: Para executar, informe DAST-FUZZ-STAGING-DESCARTAVEL
        required: false
        default: NAO
        type: string

permissions:
  contents: read

concurrency:
  group: octaclin-staging-e2e-mutavel
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.25.0"
  NODE_ENV: production
  APP_AMBIENTE: test
  E2E_WEB_URL: http://127.0.0.1:3000
  E2E_API_URL: http://127.0.0.1:3001
  E2E_CONFIRMAR_REMOTO: SIM
  DAST_FUZZ_CONFIRMAR_EXECUCAO: ${{ inputs.confirmacao_seguranca_dinamica }}
  SEGURANCA_DINAMICA_HABILITADA: ${{ inputs.executar_seguranca_dinamica }}
  DAST_ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
  OCTACLIN_PROCESSO: web
  BANCO_EXECUTAR_MIGRACOES: "false"
  CORS_ORIGINS: http://127.0.0.1:3000
  OCTACLIN_BACKEND_URL: http://127.0.0.1:3001
  OCTACLIN_TENANT_SLUG: octaclin-e2e-alfa
  OCTACLIN_COOKIE_SECURE: "true"
  OCTACLIN_API_ORIGENS_PERMITIDAS: http://127.0.0.1:3001
  OCTACLIN_WEB_ORIGENS_PERMITIDAS: http://127.0.0.1:3000
  OCTACLIN_WEB_URL: http://127.0.0.1:3000
  PORT: "3001"
  REDIS_URL: redis://127.0.0.1:6379
  ARMAZENAMENTO_BUCKET_MIDIA: octaclin-e2e
  ARMAZENAMENTO_S3_ENDPOINT: http://127.0.0.1:9000
  ARMAZENAMENTO_S3_REGION: us-east-1
  ARMAZENAMENTO_S3_ACCESS_KEY_ID: octaclin-e2e
  ARMAZENAMENTO_S3_SECRET_ACCESS_KEY: octaclin-e2e-secret
  ARMAZENAMENTO_S3_IF_NONE_MATCH: "false"
  ARMAZENAMENTO_S3_FORCE_PATH_STYLE: "true"
  EXPOR_LINK_RECUPERACAO_SENHA: "true"

jobs:
  jornadas-mutaveis:
    name: PostgreSQL real, dois tenants e jornadas mutaveis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            octaclin-backend/pnpm-lock.yaml
            octaclin-web/pnpm-lock.yaml

      - name: Validar autorizacao da seguranca dinamica antes de provisionar
        if: inputs.executar_seguranca_dinamica == true
        run: node scripts/seguranca-dinamica-cli.mjs preflight

      - name: Instalar Neon CLI
        run: npm install --global neonctl@3.6.0

      - name: Validar configuracao do ambiente E2E
        shell: bash
        run: |
          test -n "${{ vars.NEON_E2E_PROJECT_ID }}"
          test -n "${{ vars.NEON_E2E_DATABASE }}"
          test -n "${{ vars.NEON_E2E_RUNTIME_ROLE }}"
          test -n "${{ secrets.NEON_API_KEY }}"

      - name: Instalar dependencias backend
        working-directory: octaclin-backend
        run: pnpm install --prod=false --frozen-lockfile=false

      - name: Instalar dependencias web
        working-directory: octaclin-web
        run: pnpm install --prod=false --frozen-lockfile=false

      - name: Criar branch Neon descartavel
        id: neon
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_E2E_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_E2E_PARENT_BRANCH_ID }}
          branch_name: fase-231-${{ github.run_id }}-${{ github.run_attempt }}
          role: neondb_owner
          database: ${{ vars.NEON_E2E_DATABASE }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Gerar segredo MFA sintetico efemero e preparar URLs e segredos
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OWNER_URL: ${{ steps.neon.outputs.db_url }}
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          RUNTIME_URL=$(neonctl connection-string "$BRANCH_ID" \
            --project-id "${{ vars.NEON_E2E_PROJECT_ID }}" \
            --role-name "${{ vars.NEON_E2E_RUNTIME_ROLE }}" \
            --database-name "${{ vars.NEON_E2E_DATABASE }}" \
            --ssl require)
          echo "::add-mask::$OWNER_URL"
          echo "::add-mask::$RUNTIME_URL"
          echo "E2E_DATABASE_OWNER_URL=$OWNER_URL" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=$RUNTIME_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$RUNTIME_URL" >> "$GITHUB_ENV"
          echo "E2E_CONFIRMAR_BANCO=${{ vars.NEON_E2E_DATABASE }}" >> "$GITHUB_ENV"
          echo "E2E_RUNTIME_ROLE=${{ vars.NEON_E2E_RUNTIME_ROLE }}" >> "$GITHUB_ENV"
          JWT_SEGREDO=$(openssl rand -hex 32)
          JWT_REFRESH_SEGREDO=$(openssl rand -hex 32)
          CRIPTOGRAFIA_CHAVE_AES_256=$(openssl rand -hex 32)
          FORMULARIO_PUBLICO_SEGREDO=$(openssl rand -hex 32)
          E2E_MFA_TOTP_SECRET=$(cd octaclin-backend && pnpm exec node -e "const OTPAuth=require('otpauth'); process.stdout.write(new OTPAuth.Secret({size:20}).base32)")
          echo "::add-mask::$JWT_SEGREDO"
          echo "::add-mask::$JWT_REFRESH_SEGREDO"
          echo "::add-mask::$CRIPTOGRAFIA_CHAVE_AES_256"
          echo "::add-mask::$FORMULARIO_PUBLICO_SEGREDO"
          echo "::add-mask::$E2E_MFA_TOTP_SECRET"
          echo "JWT_SEGREDO=$JWT_SEGREDO" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SEGREDO=$JWT_REFRESH_SEGREDO" >> "$GITHUB_ENV"
          echo "CRIPTOGRAFIA_CHAVE_AES_256=$CRIPTOGRAFIA_CHAVE_AES_256" >> "$GITHUB_ENV"
          echo "FORMULARIO_PUBLICO_SEGREDO=$FORMULARIO_PUBLICO_SEGREDO" >> "$GITHUB_ENV"
          echo "E2E_MFA_TOTP_SECRET=$E2E_MFA_TOTP_SECRET" >> "$GITHUB_ENV"
          if [ "$SEGURANCA_DINAMICA_HABILITADA" = "true" ]; then
            META_WHATSAPP_WEBHOOK_VERIFY_TOKEN=$(openssl rand -hex 32)
            META_WHATSAPP_WEBHOOK_RECEIVE_TOKEN=$(openssl rand -hex 32)
            META_WHATSAPP_APP_SECRET=$(openssl rand -hex 32)
            echo "::add-mask::$META_WHATSAPP_WEBHOOK_VERIFY_TOKEN"
            echo "::add-mask::$META_WHATSAPP_WEBHOOK_RECEIVE_TOKEN"
            echo "::add-mask::$META_WHATSAPP_APP_SECRET"
            echo "META_WHATSAPP_WEBHOOK_VERIFY_TOKEN=$META_WHATSAPP_WEBHOOK_VERIFY_TOKEN" >> "$GITHUB_ENV"
            echo "META_WHATSAPP_WEBHOOK_RECEIVE_TOKEN=$META_WHATSAPP_WEBHOOK_RECEIVE_TOKEN" >> "$GITHUB_ENV"
            echo "META_WHATSAPP_APP_SECRET=$META_WHATSAPP_APP_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Aplicar migrations no branch descartavel com owner
        working-directory: octaclin-backend
        shell: bash
        run: DATABASE_URL="$E2E_DATABASE_OWNER_URL" pnpm migration:run

      - name: Preparar fixtures e grants da role runtime
        working-directory: octaclin-backend
        run: pnpm e2e:staging:prepare

      - name: Validar role, RLS forcado e dois tenants
        working-directory: octaclin-backend
        run: pnpm e2e:staging:preflight

      - name: Iniciar Redis e MinIO efemeros
        shell: bash
        run: |
          docker run -d --name octaclin-redis -p 6379:6379 redis:7-alpine
          docker run -d --name octaclin-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$ARMAZENAMENTO_S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$ARMAZENAMENTO_S3_SECRET_ACCESS_KEY" \
            minio/minio server /data
          minio_pronto=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/tmp/octaclin-minio-health; then
              minio_pronto=1
              break
            fi
            sleep 1
          done
          test "$minio_pronto" = "1"
          docker run --rm --network host --entrypoint /bin/sh \
            -e ARMAZENAMENTO_S3_ACCESS_KEY_ID \
            -e ARMAZENAMENTO_S3_SECRET_ACCESS_KEY \
            -e ARMAZENAMENTO_BUCKET_MIDIA \
            minio/mc -c '
              mc alias set local http://127.0.0.1:9000 \
                "$ARMAZENAMENTO_S3_ACCESS_KEY_ID" "$ARMAZENAMENTO_S3_SECRET_ACCESS_KEY" &&
              mc mb --ignore-existing "local/$ARMAZENAMENTO_BUCKET_MIDIA"
            '

      - name: Build backend
        working-directory: octaclin-backend
        run: pnpm build

      - name: Build web
        working-directory: octaclin-web
        run: pnpm build

      - name: Iniciar backend e web
        shell: bash
        run: |
          (cd octaclin-backend && node dist/main.js > ../e2e-backend.log 2>&1) &
          echo $! > e2e-backend.pid
          (cd octaclin-web && pnpm exec next start -H 127.0.0.1 -p 3000 > ../e2e-web.log 2>&1) &
          echo $! > e2e-web.pid

      - name: Aguardar servicos
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "$E2E_API_URL/health/pronto" >/dev/null && curl -fsS "$E2E_WEB_URL/login" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat e2e-backend.log || true
          cat e2e-web.log || true
          exit 1

      - name: Executar jornadas mutaveis
        working-directory: octaclin-web
        run: pnpm e2e:staging:mutavel

      - name: Executar probes de seguranca com orcamento fechado
        if: inputs.executar_seguranca_dinamica == true
        working-directory: octaclin-web
        run: pnpm e2e:staging:seguranca

      - name: Executar OWASP ZAP Baseline passivo
        if: inputs.executar_seguranca_dinamica == true
        shell: bash
        run: |
          ZAP_WORK_DIR="$RUNNER_TEMP/pr54-zap-$GITHUB_RUN_ID"
          install -d -m 0777 "$ZAP_WORK_DIR"
          set +e
          docker run --rm --network host \
            -v "$ZAP_WORK_DIR:/zap/wrk/:rw" \
            "$DAST_ZAP_IMAGE" \
            zap-baseline.py -t "$E2E_WEB_URL" -m 1 -T 5 -I \
            -J .pr54-zap-report.json
          ZAP_EXIT_CODE=$?
          set -e
          if [ "$ZAP_EXIT_CODE" -gt 2 ]; then
            echo "ZAP encerrou com erro operacional; relatorio nao e evidencia PASS."
            exit 1
          fi
          node scripts/seguranca-dinamica-cli.mjs avaliar-zap \
            "$ZAP_WORK_DIR/.pr54-zap-report.json" \
            security/dast-fuzz-falsos-positivos.json \
            artifacts/security/pr54-zap-resumo.json

      - name: Executar onboarding e ciclo de vida da Fase 228
        working-directory: octaclin-web
        run: pnpm e2e:fase228:onboarding

      - name: Exibir migrations aplicadas
        if: always() && steps.neon.outputs.branch_id != ''
        working-directory: octaclin-backend
        shell: bash
        run: >-
          DATABASE_URL="$E2E_DATABASE_OWNER_URL"
          pnpm exec typeorm-ts-node-commonjs migration:show
          -d src/infraestrutura/banco-dados/fonte-dados.ts

      - name: Publicar evidencias sem credenciais
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fase-231-e2e-logs
          path: |
            e2e-backend.log
            e2e-web.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar evidencias sanitizadas da seguranca dinamica
        if: always() && inputs.executar_seguranca_dinamica == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr54-seguranca-dinamica-sanitizada
          path: artifacts/security
          if-no-files-found: warn
          retention-days: 30

      - name: Excluir branch Neon descartavel
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_E2E_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
